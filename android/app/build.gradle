plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.hires.flacplayer'
    compileSdk 34

    defaultConfig {
        applicationId "com.hires.flacplayer"
        minSdk 24 // Compatible with Android 7.0+ and Sony Xperia XZ1 (LineageOS 15 / Android 8.0 Oreo API 26)
        targetSdk 34
        versionCode 2
        versionName "2.0-XZ1-HiRes"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug // Signed with debug key so it installs directly on Sony XZ1 LineageOS 15 without extra signing tools
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
