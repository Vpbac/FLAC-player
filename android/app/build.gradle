plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.hires.flacplayer'
    compileSdk 35

    defaultConfig {
        applicationId "com.hires.flacplayer"
        minSdk 26
        targetSdk 35 // Optimized for LineageOS Android 15 (API 35) on Sony Xperia XZ1
        versionCode 3
        versionName "2.1-XZ1-Android15"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
