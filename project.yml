name: FlacPlayeriOS
options:
  bundleIdPrefix: com.flacplayer
  deploymentTarget:
    iOS: "15.0"
targets:
  FlacPlayeriOS:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: FlacPlayeriOS
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flacplayer.ios
        INFOPLIST_FILE: FlacPlayeriOS/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: "-"
        AD_HOC_CODE_SIGNING_ALLOWED: "YES"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: false
