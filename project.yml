name: FlacPlayeriOS
options:
  bundleIdPrefix: com.flacplayer
  deploymentTarget:
    iOS: "15.0"
targets:
  FlacPlayeriOS:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - FlacPlayeriOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flacplayer.ios
        INFOPLIST_FILE: FlacPlayeriOS/Info.plist
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: false
